name: Sync Neo-PS-PIE Documents

on:
  workflow_dispatch:

  schedule:
    # Every 3rd day at 03:00 UTC (roughly)
    - cron: "0 3 */3 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download documents
        run: |
          mkdir -p pdf txt

          # PDFs
          wget 'https://docs.google.com/document/export?format=pdf&id=1bBhzdu2ReuzlsNoUzCr2z_Z0bjQQzbWZZBLpXmDdemQ' --retry-on-http-error=500 -O pdf/Czasowniki.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1iiT4mzIln_J_gTR6i_JhU_1zx6aePrMxcN6Xp9USdas' --retry-on-http-error=500 -O pdf/Spojniki.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=18O8hLNg7t0Xr9IoqCS-XXN8IHakmAISckTYL9m7KLB0' --retry-on-http-error=500 -O pdf/Przedrostki.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1s3JmEY-QAqwX3PiRK8KtiXOYQgMO07XwxgBdwjjk44c' --retry-on-http-error=500 -O pdf/Przyimki-Partykuly.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1fbBSZv9ZEIb5vcVrwvwWcHxC9XmTPBtqGEjkzNQhAKI' --retry-on-http-error=500 -O pdf/Operatory.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1yXQViwNll5QWnrXa6zL6NQNk8gFiNuhcQ1GcSZDF1tE' --retry-on-http-error=500 -O pdf/Slowa.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1KmHq9a2Ua-1weYb6oqhV7ANDUepMz2G8XeArYAumX9Y' --retry-on-http-error=500 -O pdf/Rzeczowniki.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1ojljRqEBe1l3oLhd8TQYe9aqO-TCVcOPNU1xXgoQwa4' --retry-on-http-error=500 -O pdf/Osoby.pdf
          wget 'https://docs.google.com/document/export?format=pdf&id=1lCjF7ljRjHNukde3QC111dxsJCghXCfGdfrFqZUtzes' --retry-on-http-error=500 -O pdf/Przyrostki.pdf

          # TXTs
          wget 'https://docs.google.com/document/export?format=txt&id=1bBhzdu2ReuzlsNoUzCr2z_Z0bjQQzbWZZBLpXmDdemQ' --retry-on-http-error=500 -O txt/Czasowniki.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1iiT4mzIln_J_gTR6i_JhU_1zx6aePrMxcN6Xp9USdas' --retry-on-http-error=500 -O txt/Spojniki.txt
          wget 'https://docs.google.com/document/export?format=txt&id=18O8hLNg7t0Xr9IoqCS-XXN8IHakmAISckTYL9m7KLB0' --retry-on-http-error=500 -O txt/Przedrostki.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1s3JmEY-QAqwX3PiRK8KtiXOYQgMO07XwxgBdwjjk44c' --retry-on-http-error=500 -O txt/Przyimki-Partykuly.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1fbBSZv9ZEIb5vcVrwvwWcHxC9XmTPBtqGEjkzNQhAKI' --retry-on-http-error=500 -O txt/Operatory.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1yXQViwNll5QWnrXa6zL6NQNk8gFiNuhcQ1GcSZDF1tE' --retry-on-http-error=500 -O txt/Slowa.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1KmHq9a2Ua-1weYb6oqhV7ANDUepMz2G8XeArYAumX9Y' --retry-on-http-error=500 -O txt/Rzeczowniki.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1ojljRqEBe1l3oLhd8TQYe9aqO-TCVcOPNU1xXgoQwa4' --retry-on-http-error=500 -O txt/Osoby.txt
          wget 'https://docs.google.com/document/export?format=txt&id=1lCjF7ljRjHNukde3QC111dxsJCghXCfGdfrFqZUtzes' --retry-on-http-error=500 -O txt/Przyrostki.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pdf txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto-sync documents"
          git push
